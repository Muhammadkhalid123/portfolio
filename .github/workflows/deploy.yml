name: Production CI/CD & AWS EC2 Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # Phase 1: Quality Assurance (Lint, Strict TypeCheck, Build Test)
  # ------------------------------------------------------------------
  validate:
    name: Lint & TypeCheck & Test Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Next.js Test Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ------------------------------------------------------------------
  # Phase 2: Build and Push Docker Container Image
  # ------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: If using AWS ECR instead of GHCR, replace with aws-actions/amazon-ecr-login

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Phase 3: Zero-Downtime Deployment to AWS EC2 Instance
  # ------------------------------------------------------------------
  deploy:
    name: Rolling Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout for docker-compose and nginx configs
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Automated Deployment on AWS EC2..."
            
            # Navigate to project root directory on EC2
            mkdir -p /var/www/portfolio
            cd /var/www/portfolio

            # Authenticate Docker with GHCR on EC2
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest container image
            echo "📥 Pulling latest container from GHCR..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # Restart containers with rolling update
            echo "🔄 Rolling container swap..."
            docker compose up -d --remove-orphans

            # Verify container health
            echo "🔍 Verifying application health status..."
            sleep 8
            docker compose ps
            
            # Cleanup dangling images to preserve EC2 disk space
            docker image prune -f

            echo "✅ Deployment completed successfully!"
