version: '3.8'

services:
  # Next.js Application Container (Port 3000 Internal)
  portfolio_app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/muhammadkhalid123/portfolio:latest
    container_name: portfolio_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    networks:
      - portfolio_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Nginx Reverse Proxy Container (Port 80/443 Public)
  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    depends_on:
      portfolio_app:
        condition: service_healthy
    networks:
      - portfolio_network

networks:
  portfolio_network:
    driver: bridge

volumes:
  certbot_etc:
  certbot_var:
