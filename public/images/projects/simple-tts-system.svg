<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120524"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-tts)" />

  <rect x="180" y="85" width="440" height="270" rx="16" fill="#180c30" stroke="#371a68" stroke-width="2" />
  <rect x="180" y="85" width="440" height="40" rx="16" fill="#29144d" />
  <circle cx="210" cy="105" r="5" fill="#f43f5e"/>
  <circle cx="226" cy="105" r="5" fill="#a855f7"/>
  <circle cx="242" cy="105" r="5" fill="#06b6d4"/>
  <text x="400" y="110" fill="#d8b4fe" font-family="monospace" font-size="12" text-anchor="middle">gtts_speech_server.py</text>

  <!-- Input text simulation -->
  <rect x="210" y="140" width="380" height="48" rx="8" fill="#100720" stroke="#4a2278" stroke-width="1" />
  <text x="225" y="162" fill="#e9d5ff" font-family="sans-serif" font-size="11">"Converting text to natural voice speech with Google gTTS..."</text>
  <rect x="525" y="150" width="55" height="26" rx="5" fill="#800020" />
  <text x="552" y="167" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Speak</text>

  <!-- Waveform Visual -->
  <g stroke="#d946ef" stroke-width="3" stroke-linecap="round">
    <line x1="220" y1="230" x2="220" y2="240"/>
    <line x1="235" y1="220" x2="235" y2="250"/>
    <line x1="250" y1="210" x2="250" y2="260"/>
    <line x1="265" y1="200" x2="265" y2="270"/>
    <line x1="280" y1="190" x2="280" y2="280"/>
    <line x1="295" y1="205" x2="295" y2="265"/>
    <line x1="310" y1="215" x2="310" y2="255"/>
    <line x1="325" y1="195" x2="325" y2="275"/>
    <line x1="340" y1="185" x2="340" y2="285"/>
    <line x1="355" y1="200" x2="355" y2="270"/>
    <line x1="370" y1="210" x2="370" y2="260"/>
    <line x1="385" y1="190" x2="385" y2="280"/>
    <line x1="400" y1="180" x2="400" y2="290" stroke="#06b6d4" stroke-width="4"/>
    <line x1="415" y1="190" x2="415" y2="280"/>
    <line x1="430" y1="205" x2="430" y2="265"/>
    <line x1="445" y1="185" x2="445" y2="285"/>
    <line x1="460" y1="200" x2="460" y2="270"/>
    <line x1="475" y1="210" x2="475" y2="260"/>
    <line x1="490" y1="195" x2="490" y2="275"/>
    <line x1="505" y1="215" x2="505" y2="255"/>
    <line x1="520" y1="200" x2="520" y2="270"/>
    <line x1="535" y1="210" x2="535" y2="260"/>
    <line x1="550" y1="220" x2="550" y2="250"/>
    <line x1="565" y1="225" x2="565" y2="245"/>
    <line x1="580" y1="230" x2="580" y2="240"/>
  </g>

  <!-- Player bar -->
  <rect x="210" y="308" width="380" height="32" rx="8" fill="#100720" stroke="#4a2278" stroke-width="1" />
  <circle cx="230" cy="324" r="9" fill="#06b6d4" />
  <polygon points="228,320 234,324 228,328" fill="#020108" />
  <line x1="248" y1="324" x2="520" y2="324" stroke="#4a2278" stroke-width="3" stroke-linecap="round" />
  <line x1="248" y1="324" x2="390" y2="324" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <circle cx="390" cy="324" r="4" fill="#ffffff" />
  <text x="560" y="328" fill="#a855f7" font-family="monospace" font-size="9">0:42 / 1:15</text>

  <text x="400" y="395" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Lightweight Web Text-to-Speech (gTTS)</text>
  <text x="400" y="415" fill="#d946ef" font-family="monospace" font-size="11" text-anchor="middle">Python • Google gTTS • FastAPI • HTML5 Audio</text>
</svg>
