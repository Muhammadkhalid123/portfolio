<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glow Sphere -->
  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Center Card Illustration -->
  <rect x="180" y="100" width="440" height="250" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Card Header -->
  <rect x="180" y="100" width="440" height="40" rx="16" fill="#1e293b" />
  <circle cx="210" cy="120" r="5" fill="#ef4444"/>
  <circle cx="226" cy="120" r="5" fill="#f59e0b"/>
  <circle cx="242" cy="120" r="5" fill="#10b981"/>
  <text x="400" y="125" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">smm-automation-scheduler.py</text>

  <!-- Automation Diagram Nodes -->
  <rect x="220" y="170" width="100" height="60" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
  <text x="270" y="198" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Redis Queue</text>
  <text x="270" y="215" fill="#06b6d4" font-family="monospace" font-size="10" text-anchor="middle">Asynchronous</text>

  <line x1="320" y1="200" x2="360" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />

  <rect x="360" y="170" width="100" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="410" y="198" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Celery Cluster</text>
  <text x="410" y="215" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Worker Pool</text>

  <line x1="460" y1="200" x2="500" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" />

  <rect x="500" y="170" width="100" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="550" y="198" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">SMM APIs</text>
  <text x="550" y="215" fill="#10b981" font-family="monospace" font-size="10" text-anchor="middle">Dispatched</text>

  <!-- Title Bottom -->
  <text x="400" y="300" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">SMM Automation Suite</text>
  <text x="400" y="322" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Python • FastAPI • Next.js • Celery • PostgreSQL</text>
</svg>
