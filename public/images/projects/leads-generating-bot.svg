<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-leads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFD0"/>
      <stop offset="100%" stop-color="#00CCA6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-leads)" />

  <!-- Frame -->
  <rect x="120" y="65" width="560" height="305" rx="16" fill="#141414" stroke="#00FFD0" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="120" y="65" width="560" height="40" rx="16" fill="#1E1E1E" />
  <circle cx="148" cy="85" r="5" fill="#f43f5e"/>
  <circle cx="164" cy="85" r="5" fill="#f59e0b"/>
  <circle cx="180" cy="85" r="5" fill="#00FFD0"/>
  <text x="400" y="90" fill="#00FFD0" font-family="monospace" font-size="12" text-anchor="middle">leads_crawler_pipeline.py</text>

  <!-- Stage 1: Target Ingestion & Scraping -->
  <rect x="145" y="130" width="145" height="120" rx="10" fill="#0F0F0F" stroke="#00FFD0" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="217" y="155" fill="#00FFD0" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">01. Web Crawler</text>
  <rect x="155" y="170" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="217" y="185" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">Playwright &amp; BS4</text>
  <rect x="155" y="198" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="217" y="213" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">Anti-Block Rotation</text>
  <rect x="155" y="226" width="125" height="16" rx="3" fill="#00FFD0" />
  <text x="217" y="238" fill="#0F0F0F" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">2,450 Targets Found</text>

  <!-- Flow 1 -> 2 -->
  <path d="M 290 190 L 330 190" stroke="#00FFD0" stroke-width="2" stroke-dasharray="3" fill="none" />

  <!-- Stage 2: Lead Extraction & Scoring -->
  <rect x="330" y="130" width="145" height="120" rx="10" fill="#0F0F0F" stroke="#00FFD0" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="402" y="155" fill="#00FFD0" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">02. Filter &amp; Qualify</text>
  <rect x="340" y="170" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="402" y="185" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">Email &amp; Phone Regex</text>
  <rect x="340" y="198" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="402" y="213" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">Deduplication Logic</text>
  <rect x="340" y="226" width="125" height="16" rx="3" fill="#00FFD0" />
  <text x="402" y="238" fill="#0F0F0F" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">98.4% Quality Score</text>

  <!-- Flow 2 -> 3 -->
  <path d="M 475 190 L 515 190" stroke="#00FFD0" stroke-width="2" stroke-dasharray="3" fill="none" />

  <!-- Stage 3: Structured Dataset / Export -->
  <rect x="515" y="130" width="145" height="120" rx="10" fill="#0F0F0F" stroke="#00FFD0" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="587" y="155" fill="#00FFD0" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">03. CRM Export</text>
  <rect x="525" y="170" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="587" y="185" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">Clean CSV / JSON</text>
  <rect x="525" y="198" width="125" height="22" rx="4" fill="#1E1E1E" />
  <text x="587" y="213" fill="#FAFAFA" font-family="monospace" font-size="9" text-anchor="middle">PostgreSQL Sync</text>
  <rect x="525" y="226" width="125" height="16" rx="3" fill="#00FFD0" />
  <text x="587" y="238" fill="#0F0F0F" font-family="monospace" font-weight="bold" font-size="8" text-anchor="middle">Enriched Leads Live</text>

  <!-- Bottom Terminal Log Output -->
  <rect x="145" y="268" width="515" height="80" rx="8" fill="#0A0A0A" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="160" y="290" fill="#00FFD0" font-family="monospace" font-size="10">[INFO] Bot worker spawned: 12 concurrency threads</text>
  <text x="160" y="308" fill="#FAFAFA" font-family="monospace" font-size="10">[200 OK] Extracted verified contact profile: John Doe (VP of Eng)</text>
  <text x="160" y="326" fill="#00FFD0" font-family="monospace" font-size="10">[SUCCESS] Batch synchronized to database: 1,840 verified leads parsed</text>

  <!-- Title & Tech -->
  <text x="400" y="405" fill="#FAFAFA" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Automated Lead-Generation Bot</text>
  <text x="400" y="425" fill="#00FFD0" font-family="monospace" font-size="11" text-anchor="middle">Python • Playwright • BeautifulSoup • Pandas • Automation</text>
</svg>
