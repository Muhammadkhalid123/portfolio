<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-infra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101a"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-infra)" />

  <rect x="180" y="100" width="440" height="250" rx="16" fill="#0d1f2e" stroke="#163f5c" stroke-width="2" />
  <rect x="180" y="100" width="440" height="40" rx="16" fill="#163f5c" />
  <circle cx="210" cy="120" r="5" fill="#f43f5e"/>
  <circle cx="226" cy="120" r="5" fill="#38bdf8"/>
  <circle cx="242" cy="120" r="5" fill="#10b981"/>
  <text x="400" y="125" fill="#7dd3fc" font-family="monospace" font-size="12" text-anchor="middle">docker-compose.microservices.yml</text>

  <!-- Container Grid -->
  <rect x="220" y="165" width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="260" y="190" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Gateway</text>
  <text x="260" y="206" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="middle">Nginx Proxy</text>

  <rect x="320" y="165" width="80" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="360" y="190" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">App Nodes</text>
  <text x="360" y="206" fill="#10b981" font-family="monospace" font-size="8" text-anchor="middle">FastAPI</text>

  <rect x="420" y="165" width="80" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="460" y="190" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cache DB</text>
  <text x="460" y="206" fill="#f59e0b" font-family="monospace" font-size="8" text-anchor="middle">Redis Clust</text>

  <rect x="520" y="165" width="80" height="60" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
  <text x="560" y="190" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Telemetry</text>
  <text x="560" y="206" fill="#a855f7" font-family="monospace" font-size="8" text-anchor="middle">Prometheus</text>

  <text x="400" y="295" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Dockerized Microservice Cloud Architecture</text>
  <text x="400" y="318" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Docker Compose • Nginx • Redis • Prometheus • Grafana</text>
</svg>
