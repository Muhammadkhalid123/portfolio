    <text x="0" y="28" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">99.8% <tspan font-size="13" font-weight="500" fill="#71717A">GROUNDED</tspan></text>
  </g>

  <!-- Left Column: Document Chunk Ingestion Pipeline -->
  <rect x="50" y="205" width="450" height="595" rx="14" fill="#0F120F" stroke="#222822" stroke-width="1"/>
  <g transform="translate(80, 240)">
