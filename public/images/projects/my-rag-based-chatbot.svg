  </g>

  <!-- Chunk Cards in Pipeline -->
  <g transform="translate(80, 285)">
    <!-- Chunk 01 -->
    <rect width="390" height="95" rx="10" fill="#151915" stroke="#262E26" stroke-width="1"/>
    <circle cx="20" cy="22" r="5" fill="#10B981"/>
    <text x="35" y="25" fill="#E4E4E7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">CHUNK_4019 · ARCHITECTURE_SPECS.MD</text>
    <text x="35" y="48" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="11">"FastAPI handles async streaming tokens over HTTP/2..."</text>
    <text x="35" y="75" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">Tokens: 384 · Cosine: 0.891 · Vector Partition: #04</text>

    <!-- Chunk 02 -->
    <g transform="translate(0, 110)">
      <rect width="390" height="95" rx="10" fill="#151915" stroke="#262E26" stroke-width="1"/>
      <circle cx="20" cy="22" r="5" fill="#10B981"/>
      <text x="35" y="25" fill="#E4E4E7" font-family="ui-monospace, monospace" font-size="11" font-weight="600">CHUNK_4020 · CONTAINER_DEPLOY.YAML</text>
      <text x="35" y="48" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="11">"Isolated Docker instances running with strict cgroup limits..."</text>
      <text x="35" y="75" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">Tokens: 412 · Cosine: 0.865 · Vector Partition: #04</text>
    </g>

    <!-- Chunk 03 -->
    <g transform="translate(0, 220)">
      <rect width="390" height="95" rx="10" fill="#151915" stroke="#262E26" stroke-width="1"/>
      <circle cx="20" cy="22" r="5" fill="#71717A"/>
      <text x="35" y="25" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="11" font-weight="600">CHUNK_4021 · SECURITY_CONTROLS.TXT</text>
      <text x="35" y="48" fill="#71717A" font-family="system-ui, -apple-system, sans-serif" font-size="11">"Row-level security enforcement with cryptographic tokens..."</text>
      <text x="35" y="75" fill="#52525B" font-family="ui-monospace, monospace" font-size="10">Tokens: 290 · Cosine: 0.781 · Vector Partition: #02</text>
    </g>

