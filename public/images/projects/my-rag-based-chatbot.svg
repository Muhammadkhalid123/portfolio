  <!-- Terminal Top Bar -->
  <g transform="translate(550, 235)">
    <circle cx="10" cy="10" r="4" fill="#EF4444"/>
    <circle cx="26" cy="10" r="4" fill="#F59E0B"/>
    <circle cx="42" cy="10" r="4" fill="#10B981"/>
    <text x="70" y="14" fill="#71717A" font-family="ui-monospace, monospace" font-size="11">rag_inference_session // prompt_grounding_v2.ts</text>
    <rect x="750" y="0" width="180" height="22" rx="11" fill="#161B16" stroke="#262E26" stroke-width="1"/>
    <text x="840" y="14" fill="#10B981" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">TOKEN STREAM: 84 T/S</text>
  </g>

  <!-- User Query Block -->
  <g transform="translate(550, 275)">
    <rect width="970" height="70" rx="10" fill="#131713" stroke="#242B24" stroke-width="1"/>
    <text x="24" y="26" fill="#71717A" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">PROMPT // USER QUERY</text>
    <text x="24" y="50" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15">"How does the system ensure zero data leakage between different organizations?"</text>
  </g>

  <!-- Retrieved Context Injected Banner -->
  <g transform="translate(550, 360)">
    <rect width="970" height="85" rx="10" fill="#0D1410" stroke="#1B3828" stroke-width="1"/>
    <circle cx="24" cy="24" r="4" fill="#10B981"/>
    <text x="40" y="28" fill="#10B981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">RETRIEVED CONTEXT INJECTION (TOP-2 VECTOR MATCHES)</text>
    <text x="40" y="48" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="11">[Source 01: docs/security.md#L45] "PostgreSQL Row-Level Security (RLS) policies filter by org_id on every query."</text>
    <text x="40" y="68" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="11">[Source 02: src/auth/jwt.py#L90] "Cryptographic tenant tokens validate permissions before retrieval execution."</text>
  </g>

  <!-- Synthesized Grounded Response -->
  <g transform="translate(550, 460)">
    <rect width="970" height="315" rx="10" fill="#141714" stroke="#262E26" stroke-width="1"/>
    <text x="24" y="30" fill="#10B981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">GROUNDED RESPONSE // LLM SYNTHESIS</text>
    
    <text x="24" y="65" fill="#E4E4E7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">The architecture enforces strict tenant isolation through two independent containment layers:</text>

    <!-- Point 1 -->
    <circle cx="34" cy="100" r="3" fill="#10B981"/>
    <text x="50" y="104" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">1. Database Layer: Row-Level Security (RLS)</text>
    <text x="50" y="125" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="13">Every database connection executes under a specific tenant context. Postgres automatically attaches a <tspan font-family="ui-monospace, monospace" fill="#34D399">WHERE org_id = current_setting(&apos;app.current_org&apos;)</tspan> clause to all queries, making cross-tenant record leakage mathematically impossible.</text>

    <!-- Point 2 -->
    <circle cx="34" cy="165" r="3" fill="#10B981"/>
    <text x="50" y="169" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">2. Vector Partitioning &amp; Query Guardrails</text>
    <text x="50" y="190" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-size="13">Vector embeddings are stored in distinct metadata-partitioned indexes. Before computing cosine similarity, the vector engine pre-filters candidates by the tenant's namespace ID.</text>

    <!-- Citation Chips -->
    <g transform="translate(50, 235)">
      <rect width="180" height="28" rx="14" fill="#1C241D" stroke="#2D4432" stroke-width="1"/>
      <text x="90" y="18" fill="#34D399" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">CITATIONS: docs/security.md</text>

      <rect x="195" y="0" width="160" height="28" rx="14" fill="#1C241D" stroke="#2D4432" stroke-width="1"/>
      <text x="275" y="18" fill="#34D399" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">VERIFIED // 0.89 SIMILARITY</text>
    </g>

    <line x1="24" y1="285" x2="946" y2="285" stroke="#222822" stroke-width="1"/>
    <text x="24" y="302" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">MODEL: CLAUDE 3.5 SONNET · INFERENCE LATENCY: 312ms · TOTAL TOKENS: 640</text>
  </g>

  <!-- Bottom Architectural Footer Bar -->
  <g transform="translate(50, 840)">
    <text x="0" y="24" fill="#52525B" font-family="ui-monospace, monospace" font-size="11">TOKYO // BERLIN STUDIO ARCHITECTURE · RAG-DRIVEN INTELLIGENCE INFRASTRUCTURE</text>
    <text x="1500" y="24" fill="#71717A" font-family="ui-monospace, monospace" font-size="11" text-anchor="end">SHA-256: 4F92B10A // ZERO DATA LEAKAGE VERIFIED</text>
  </g>
