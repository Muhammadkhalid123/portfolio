    <text x="0" y="28" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">0.842 <tspan font-size="13" font-weight="500" fill="#71717A">OPTIMAL</tspan></text>
  </g>
  <line x1="720" y1="120" x2="720" y2="165" stroke="#222822" stroke-width="1"/>
  <g transform="translate(750, 132)">
    <text x="0" y="0" fill="#71717A" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">RETRIEVAL LATENCY (P95)</text>
    <text x="0" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">18.4 ms</text>
