  <!-- Background -->
  <rect width="1600" height="900" fill="url(#rag-bg)"/>
  <rect width="1600" height="900" fill="url(#rag-glow)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="#1F241F" stroke-width="0.75" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="900"/>
    <line x1="480" y1="0" x2="480" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="1520" y1="0" x2="1520" y2="900"/>
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="190" x2="1600" y2="190"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
  </g>

  <!-- Studio Header Navigation Bar -->
  <rect x="0" y="0" width="1600" height="80" fill="#0F120F" stroke="#1F241F" stroke-width="1"/>
  <circle cx="50" cy="40" r="14" fill="#FFFFFF"/>
  <text x="50" y="45" fill="#0C0D0C" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" text-anchor="middle">R</text>
  <text x="78" y="46" fill="#F4F4F4" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17" letter-spacing="1">RAG // INTEL ENGINE</text>
  <text x="310" y="46" fill="#71717A" font-family="ui-monospace, monospace" font-size="12">SYSTEM 01 // VECTOR SIMILARITY &amp; CITATION PIPELINE</text>

