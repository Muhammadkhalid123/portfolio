  <text x="792" y="45" fill="#E4E4E7" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">RETRIEVAL</text>
  <text x="895" y="45" fill="#71717A" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">EMBEDDINGS</text>
  <text x="995" y="45" fill="#71717A" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CHUNKS</text>
  <text x="1085" y="45" fill="#71717A" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">TELEMETRY</text>

