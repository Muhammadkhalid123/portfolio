      <text x="16" y="24" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">HIGH-DIMENSIONAL VECTOR CLUSTERING (t-SNE)</text>
      <!-- Simulated Cluster Points -->
      <circle cx="80" cy="80" r="4" fill="#10B981"/>
      <circle cx="95" cy="70" r="3" fill="#10B981" opacity="0.8"/>
      <circle cx="70" cy="95" r="3" fill="#10B981" opacity="0.7"/>
      <circle cx="110" cy="85" r="5" fill="#34D399"/>
      <circle cx="140" cy="110" r="2" fill="#52525B"/>
      
      <circle cx="250" cy="65" r="4" fill="#38BDF8"/>
      <circle cx="270" cy="75" r="3" fill="#38BDF8" opacity="0.8"/>
      <circle cx="240" cy="85" r="3" fill="#38BDF8" opacity="0.7"/>

      <circle cx="320" cy="115" r="3" fill="#A1A1AA"/>
      <circle cx="340" cy="105" r="4" fill="#A1A1AA"/>

      <!-- Distance boundary ring -->
      <circle cx="95" cy="80" r="45" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3" fill="none" opacity="0.4"/>
      <text x="16" y="132" fill="#10B981" font-family="ui-monospace, monospace" font-size="10">Active Cluster: 48 Nearest Neighbors Identified</text>
    </g>
