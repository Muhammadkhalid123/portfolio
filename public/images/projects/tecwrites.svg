    <text x="0" y="28" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">60 SEC <tspan font-size="13" font-weight="500" fill="#64748B">ON-DEMAND</tspan></text>
  </g>
  <line x1="1050" y1="120" x2="1050" y2="165" stroke="#202A35" stroke-width="1"/>
