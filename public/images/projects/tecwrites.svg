  <!-- Right Column: Editorial Reading Layout Preview -->
  <rect x="530" y="205" width="1020" height="595" rx="14" fill="#0D1117" stroke="#1D2631" stroke-width="1"/>
  
  <g transform="translate(560, 238)">
    <circle cx="10" cy="10" r="4" fill="#10B981"/>
    <text x="24" y="14" fill="#10B981" font-family="ui-monospace, monospace" font-size="11" font-weight="700">LIVE EDITORIAL PREVIEW // SWISS TYPOGRAPHIC LAYOUT</text>
    <text x="800" y="14" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">READING TIME: 4 MIN</text>
  </g>

  <!-- Editorial Article Sheet -->
  <g transform="translate(560, 275)">
    <rect width="960" height="500" rx="10" fill="#090D12" stroke="#1A232E" stroke-width="1"/>

    <!-- Reading Progress Bar -->
    <rect width="960" height="3" fill="#1E293B"/>
    <rect width="380" height="3" fill="url(#tw-rule)"/>

    <g transform="translate(50, 45)">
      <!-- Article Tag & Date -->
      <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="1">DEVOPS ARCHITECTURE · OCTOBER 2024</text>
      
      <!-- Article Title (Display) -->
      <text x="0" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.5">
        Achieving Zero-Downtime Container Swaps on Single-Instance VPS
      </text>

      <text x="0" y="70" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-style="italic">
        An engineering retrospective on decoupling proxy routing, healthchecks, and ephemeral blue/green containers.
      </text>

      <line x1="0" y1="95" x2="860" y2="95" stroke="#1E293B" stroke-width="1"/>

      <!-- Article Body Layout -->
      <g transform="translate(0, 125)">
        <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" leading-relaxed>
          When deploying microservice architectures to modest compute instances like AWS t3.micro or Hetzner VPS nodes,
        </text>
        <text x="0" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14">
          relying on managed load balancers often introduces disproportionate monthly infrastructure costs. To resolve this,
        </text>
        <text x="0" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14">
          we orchestrated an automated dual-container rotation technique powered by local Nginx upstream reloading.
        </text>

        <!-- Callout Quote Box -->
        <g transform="translate(0, 80)">
          <rect width="860" height="75" rx="8" fill="#101720" stroke="#1D2A3A" stroke-width="1"/>
          <rect width="4" height="75" fill="#38BDF8"/>
          <text x="24" y="28" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">CORE ARCHITECTURAL INSIGHT</text>
          <text x="24" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13">
            "By executing <tspan font-family="ui-monospace, monospace" fill="#34D399">nginx -s reload</tspan> only after the incoming container passes HTTP 200 health verification, packet drops fall to zero."
          </text>
        </g>

        <!-- Code Callout -->
        <g transform="translate(0, 175)">
          <rect width="860" height="90" rx="8" fill="#0A0E13" stroke="#17222E" stroke-width="1"/>
          <text x="20" y="24" fill="#64748B" font-family="ui-monospace, monospace" font-size="10">AUTOMATION SCRIPT // DEPLOY.SH</text>
          <text x="20" y="48" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="12">docker compose up -d --no-deps --scale app=2 --no-recreate app</text>
          <text x="20" y="68" fill="#10B981" font-family="ui-monospace, monospace" font-size="12">curl -f http://localhost:3001/api/health &amp;&amp; docker rm -f old_app</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer -->
