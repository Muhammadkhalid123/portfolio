    <text x="0" y="28" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">100 / 100 <tspan font-size="13" font-weight="500" fill="#64748B">PERFECT</tspan></text>
  </g>
