    <text x="0" y="28" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">38 ms <tspan font-size="13" font-weight="500" fill="#64748B">EDGE CACHED</tspan></text>
  </g>
  <line x1="380" y1="120" x2="380" y2="165" stroke="#202A35" stroke-width="1"/>
