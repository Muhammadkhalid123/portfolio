  </g>

  <!-- Left Column: MDX Compiler Pipeline & AST Inspector -->
  <rect x="50" y="205" width="460" height="595" rx="14" fill="#0D1117" stroke="#1D2631" stroke-width="1"/>
  <g transform="translate(75, 238)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">MDX SOURCE COMPILATION</text>
    <text x="0" y="20" fill="#475569" font-family="ui-monospace, monospace" font-size="10">REMARK · REHYPE · SHIKI SYNTAX HIGHLIGHTER</text>
  </g>

  <!-- Code Snippet Box -->
  <g transform="translate(75, 280)">
    <rect width="410" height="320" rx="10" fill="#090D12" stroke="#1A232E" stroke-width="1"/>
    
    <!-- Code Window Title -->
    <rect width="410" height="34" rx="10" fill="#131B24"/>
    <circle cx="18" cy="17" r="4" fill="#EF4444"/>
    <circle cx="32" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="46" cy="17" r="4" fill="#10B981"/>
    <text x="70" y="21" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">content/articles/zero-downtime.mdx</text>

    <!-- Syntax Code lines -->
    <g transform="translate(20, 55)" font-family="ui-monospace, monospace" font-size="11">
      <text x="0" y="0" fill="#64748B">---</text>
      <text x="0" y="20" fill="#38BDF8">title: <tspan fill="#F8FAFC">"Zero-Downtime Container Swaps"</tspan></text>
      <text x="0" y="40" fill="#38BDF8">date: <tspan fill="#F8FAFC">"2024-10-14"</tspan></text>
      <text x="0" y="60" fill="#38BDF8">tags: <tspan fill="#F8FAFC">["DevOps", "Docker", "Nginx"]</tspan></text>
      <text x="0" y="80" fill="#64748B">---</text>
      
      <text x="0" y="115" fill="#F43F5E">import <tspan fill="#F8FAFC">{ ArchitectureDiagram }</tspan> <tspan fill="#F43F5E">from</tspan> <tspan fill="#34D399">'@/components'</tspan></text>
      
      <text x="0" y="150" fill="#94A3B8">### 1. Ingress Proxy Configuration</text>
      <text x="0" y="175" fill="#64748B">```nginx</text>
      <text x="0" y="195" fill="#38BDF8">upstream backend_cluster {</text>
      <text x="16" y="215" fill="#E2E8F0">server 127.0.0.1:3000 max_fails=2;</text>
      <text x="16" y="235" fill="#E2E8F0">keepalive 32;</text>
      <text x="0" y="255" fill="#38BDF8">}</text>
    </g>

    <!-- MDX Plugins Active -->
    <g transform="translate(0, 335)">
      <rect width="410" height="150" rx="10" fill="#0A0E13" stroke="#1A232E" stroke-width="1"/>
      <text x="16" y="24" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="11" font-weight="600">COMPILER PLUGINS // TELEMETRY</text>
      
      <g transform="translate(16, 45)">
        <text x="0" y="0" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">remark-gfm</text>
        <text x="240" y="0" fill="#10B981" font-family="ui-monospace, monospace" font-size="11">PASS (0.02ms)</text>
      </g>
      <g transform="translate(16, 75)">
        <text x="0" y="0" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">rehype-slug</text>
        <text x="240" y="0" fill="#10B981" font-family="ui-monospace, monospace" font-size="11">PASS (0.01ms)</text>
      </g>
      <g transform="translate(16, 105)">
        <text x="0" y="0" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">shiki-syntax-highlighter</text>
        <text x="240" y="0" fill="#38BDF8" font-family="ui-monospace, monospace" font-size="11">TOKYO NIGHT</text>
      </g>
    </g>
