      <text x="35" y="48" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">Decoupled authentication into stateless service + Redis cache + asynchronous Celery queues.</text>
      <text x="35" y="70" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">Components: [Auth Microservice, Redis Cache, Celery Queue]</text>
    </g>

    <!-- Key Takeaway 3 -->
