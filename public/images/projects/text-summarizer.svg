<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0720"/>
      <stop offset="100%" stop-color="#03000a"/>
    </linearGradient>
    <filter id="glow-ai">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-ai)" />
  <circle cx="400" cy="225" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow-ai)"/>

  <!-- Center Transformer Visual -->
  <rect x="180" y="100" width="440" height="250" rx="16" fill="#17102e" stroke="#2e1d54" stroke-width="2" />
  
  <rect x="180" y="100" width="440" height="40" rx="16" fill="#241544" />
  <circle cx="210" cy="120" r="5" fill="#ec4899"/>
  <circle cx="226" cy="120" r="5" fill="#a855f7"/>
  <circle cx="242" cy="120" r="5" fill="#06b6d4"/>
  <text x="400" y="125" fill="#c084fc" font-family="monospace" font-size="12" text-anchor="middle">nlp_transformer_pipeline.py</text>

  <!-- Flow Boxes -->
  <rect x="220" y="165" width="90" height="65" rx="8" fill="#241544" stroke="#a855f7" stroke-width="1.5" />
  <text x="265" y="195" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Raw Text</text>
  <text x="265" y="212" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">5,000+ words</text>

  <line x1="310" y1="198" x2="355" y2="198" stroke="#d946ef" stroke-width="2" stroke-dasharray="3" />

  <rect x="355" y="165" width="90" height="65" rx="8" fill="#241544" stroke="#d946ef" stroke-width="1.5" />
  <text x="400" y="195" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">BART / T5</text>
  <text x="400" y="212" fill="#e879f9" font-family="monospace" font-size="9" text-anchor="middle">Attention Layer</text>

  <line x1="445" y1="198" x2="490" y2="198" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3" />

  <rect x="490" y="165" width="90" height="65" rx="8" fill="#241544" stroke="#06b6d4" stroke-width="1.5" />
  <text x="535" y="195" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Abstractive</text>
  <text x="535" y="212" fill="#67e8f9" font-family="monospace" font-size="9" text-anchor="middle">Executive Brief</text>

  <text x="400" y="295" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">AI Text Summarizer & Synthesizer</text>
  <text x="400" y="318" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">Hugging Face • PyTorch • LangChain • FastAPI</text>
</svg>
