      <circle cx="20" cy="22" r="5" fill="#38BDF8"/>
      <text x="35" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Empirical Business Impact</text>
      <text x="35" y="48" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="12">P99 response time decreased from 1,240ms to 48ms (-96%) with $42K monthly savings.</text>
      <text x="35" y="70" fill="#71717A" font-family="ui-monospace, monospace" font-size="10">Impact: 96% Latency Reduction · $42,000 / month Cost Savings</text>
