    </text>
    <text x="24" y="138" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="13">
      of monolithic compute bottlenecks across our primary ingress cluster. System profiling revealed
    </text>
    <text x="24" y="161" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="13">
      that 74% of latency spikes occurred during unindexed cross-table relational joins within the primary
    </text>
    <text x="24" y="184" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="13">
      PostgreSQL database instance, exacerbating connection pool exhaustion under sustained loads..."
    </text>

    <!-- Highlighted passage -->
    <g transform="translate(24, 210)">
      <rect width="582" height="60" rx="6" fill="#1C142B" stroke="#3D295C" stroke-width="1"/>
      <text x="12" y="24" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="12">
        "Core Resolution: The team decoupled user authorization into a lightweight stateless microservice,
      </text>
      <text x="12" y="46" fill="#E4E4E7" font-family="system-ui, sans-serif" font-size="12">
        migrated caching to an in-memory Redis cluster, and implemented asynchronous worker queues."
      </text>
    </g>

    <text x="24" y="300" fill="#71717A" font-family="system-ui, sans-serif" font-size="13">
      "Following deployment of the isolated container nodes, aggregate 99th percentile response time
    </text>
    <text x="24" y="323" fill="#71717A" font-family="system-ui, sans-serif" font-size="13">
      dropped from 1,240ms to 48ms, reducing compute infrastructure expenditure by $42,000 monthly..."
    </text>

